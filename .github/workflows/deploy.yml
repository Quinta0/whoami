name: Redirect GitHub Pages to Cloudflare

# The site lives on Cloudflare now; GitHub Pages only forwards old links.
on:
  push:
    branches: ["main"]
    paths: ["gh-pages/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp gh-pages/index.html gh-pages/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages
      - id: deployment
        uses: actions/deploy-pages@v4
